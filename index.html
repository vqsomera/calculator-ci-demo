<!DOCTYPE html>
<html>

<head>
    <title>Calculator Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculator Project</h1>
    <p>Number1* : <input type="number" id="num1"></p>
    <p>Number2* : <input type="number" id="num2"></p>
    <button onclick="uiAdd()">Add</button>
    <button onclick="uiSubtract()">Subtract</button>
    <button onclick="uiMultiply()">Multiply</button>
    <button onclick="uiDivide()">Divide</button>
    <button onclick="uiSquare()">Square**</button>
    <button onclick="uiCube()">Cube**</button>
    <p class="hint-text"><small>** Square and Cube only use Number1</small></p>

    <p>Result &nbsp;&nbsp;&nbsp; : <span id="result"></span></p>
    <script src="calculator.js"></script>
</body>

</html>
